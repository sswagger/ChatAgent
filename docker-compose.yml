version: '3.8'

services:
  ai-chatbot:
    build:
      context: .
      dockerfile: .docker/agent/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .docker/agent/.env
    volumes:
      - ./agent:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
