version: '3.8'

services:
  ai-chatbot:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .docker/chatAgent/.env
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
