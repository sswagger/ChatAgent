<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Settings</h2>
                <button id="newChatBtn" class="btn-primary">New Chat</button>
            </div>

            <div class="config-section">
                <label for="systemPrompt" class="config-label">System Prompt</label>
                <textarea id="systemPrompt" class="config-input" rows="4" placeholder="Enter system prompt..."></textarea>
            </div>

            <div class="config-section">
                <label for="bufferSize" class="config-label">Buffer Size</label>
                <input type="number" id="bufferSize" class="config-input" min="1" max="50" value="10">
                <small class="config-hint">Number of messages to keep in context</small>
            </div>

            <div class="config-section">
                <label for="temperature" class="config-label">Temperature</label>
                <input type="number" id="temperature" class="config-input" min="0" max="2" step="0.1" value="0.7">
                <small class="config-hint">Creativity level (0 = deterministic, 2 = creative)</small>
            </div>

            <div class="config-section">
                <button id="saveConfigBtn" class="btn-secondary">Save Configuration</button>
            </div>

            <div class="token-counter">
                <div class="token-info">
                    <span>Token Usage</span>
                    <span id="tokenCount">0</span>
                </div>
                <div class="token-progress">
                    <div id="tokenBar" class="token-bar"></div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <h1>AI Chat Assistant</h1>
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="message system">
                    <div class="message-content">System initialized with configured system prompt.</div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="messageInput" class="message-input" placeholder="Type your message..."></textarea>
                <button id="sendBtn" class="btn-primary">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
